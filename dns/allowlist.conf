# allowlist.conf — domains allowed during a closed-internet exam
#
# Syntax:
#   address=/example.com/#   -> pass through to upstream DNS (real resolution)
#   address=/example.com/192.168.4.1  -> resolve to a specific IP (local override)
#
# After editing this file, reload dnsmasq without restarting the container:
#   docker kill --signal=HUP 490-dns
#
# -----------------------------------------------------------------------
# Google OAuth CIDR ranges (for reference — used in exam-nat.service FORWARD rules)
# These change occasionally; verify at https://www.gstatic.com/ipranges/goog.json
#   142.250.0.0/15
#   172.217.0.0/16
#   74.125.0.0/16
# -----------------------------------------------------------------------

# --- CheckHen app ---
# Replace 192.168.4.1 with the actual IP of your Pi's wlan0 interface.
# Check with: ip addr show wlan0
address=/checkhen.local/192.168.4.1

# --- Google OAuth (required for sign-in) ---
address=/accounts.google.com/#
address=/oauth2.googleapis.com/#
address=/www.googleapis.com/#
address=/googleapis.com/#

# --- Google fonts / static assets (required for app UI) ---
address=/fonts.googleapis.com/#
address=/fonts.gstatic.com/#

# --- Add additional allowlisted domains below this line ---
