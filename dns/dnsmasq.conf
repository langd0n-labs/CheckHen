# dnsmasq.conf — CheckHen exam DNS filter
#
# Strategy: block everything by default, allowlist in allowlist.conf.
# Blocked domains return 0.0.0.0 (null route), not NXDOMAIN,
# so clients fail fast instead of waiting for a timeout.

# --- Interface binding ---
# Only serve DNS on the AP interface. Change wlan0 if your AP
# interface has a different name (check with: ip link show).
interface=wlan0
bind-interfaces

# --- Upstream DNS ---
# Used only for domains that allowlist.conf passes through (address=/.../# syntax).
server=8.8.8.8
server=8.8.4.4

# --- Block all domains by default ---
address=/#/0.0.0.0

# --- Allowlist ---
# Entries are in a separate file for easy editing without touching this file.
conf-dir=/etc/dnsmasq.d/,*.conf

# --- DHCP ---
# Disabled — DHCP is handled by hostapd + the host dnsmasq instance (if any).
# Remove this line only if you want this container to also serve DHCP.
no-dhcp-interface=wlan0

# --- Logging (optional, useful for debugging) ---
# Uncomment to log all DNS queries to docker logs:
# log-queries
# log-facility=-
