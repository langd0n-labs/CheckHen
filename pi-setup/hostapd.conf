# hostapd.conf — CheckHen exam WiFi access point configuration
#
# This file is managed by the repo. Copy it into place via install.sh.
# After editing, restart the service: sudo systemctl restart hostapd-exam

# --- Interface ---
# wlan0 is the Pi's built-in WiFi. The two network extenders connect via USB
# and appear as wlan1 (uplink to internet, used for NAT in exam-nat.service).
interface=wlan0

# --- Driver ---
driver=nl80211

# --- Network identity ---
ssid=CheckHen-Exam
# Change the SSID to something recognizable for the class.

# --- Radio settings ---
hw_mode=g
channel=6
# Use channel 1, 6, or 11 to avoid overlap. Check for interference with:
#   sudo iwlist wlan0 scan | grep -E 'ESSID|Channel'

# --- Security ---
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=checkhen2024
# Change this passphrase before each exam or semester.

# --- Misc ---
wmm_enabled=0
macaddr_acl=0
ignore_broadcast_ssid=0
